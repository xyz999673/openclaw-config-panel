<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex 控制台</title>
  <script>
    (() => {
      const RECOVERY_FLAG = 'codex-console-runtime-recovery';
      function shouldRecover(message) {
        const text = String(message || '');
        return /(jobBadge|attachmentBadge|threadCountBadge) is not defined/.test(text)
          || /Unexpected end of input/.test(text);
      }
      function reloadOnce(reason) {
        try {
          if (sessionStorage.getItem(RECOVERY_FLAG) === reason) return;
          sessionStorage.setItem(RECOVERY_FLAG, reason);
        } catch (_) {}
        const url = new URL(window.location.href);
        url.searchParams.set('_cv', String(Date.now()));
        window.location.replace(url.toString());
      }
      window.addEventListener('error', (event) => {
        const message = String(event?.message || event?.error?.message || '');
        if (shouldRecover(message)) reloadOnce('bootstrap-runtime-error');
      }, true);
      window.addEventListener('load', () => {
        try { sessionStorage.removeItem(RECOVERY_FLAG); } catch (_) {}
      }, { once: true });
    })();
  </script>
  <style>

      overflow: hidden;

      background: rgba(2,6,23,.64);

      z-index: 30;

    }

        grid-template-columns: 320px minmax(0, 1fr);

        padding: 14px;

      html[data-layout="mobile"] body.drawer-open .sidebar {

    let authState = { initialized: false, logged_in: false, username: null };

    function appPath(path) { return `${BASE_PATH}${path}`; }
    function loginUrl() {

    function resolveLayoutMode() {

      return LAYOUT_MEDIA.matches ? 'mobile' : 'desktop';

    function setStatus(message = '', type = '') {

    }
    async function request(path, options = {}, redirectOnAuth = true) {
      const response = await fetch(appPath(path), { cache: 'no-store', ...options });
      const payload = await response.json().catch(() => ({ ok: false, error: '响应解析失败' }));
      if ((response.status === 401 || response.status === 403) && redirectOnAuth) {
        window.location.replace(loginUrl());
        throw new Error('登录已失效，正在跳转。');
      }
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || '请求失败');
      }
      return payload.data;
    }
    function formatDateTime(value) {
      const ts = Number(value || 0);
      if (!ts) return '-';
      return new Date(ts * 1000).toLocaleString('zh-CN', { hour12: false });
    }
    function formatRelativeTime(value) {
      const ts = Number(value || 0);
      if (!ts) return '-';
      const diff = Math.max(0, Math.floor(Date.now() / 1000 - ts));
      if (diff < 60) return `${diff} 秒前`;
      if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
      return `${Math.floor(diff / 86400)} 天前`;
    }
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => {
        if (char === '&') return '&amp;';
        if (char === '<') return '&lt;';
        if (char === '>') return '&gt;';
        if (char === '"') return '&quot;';
        return '&#39;';
      });
    }
    function sanitizeMarkdownUrl(rawUrl) {
      const value = String(rawUrl || '').trim();
      if (!value) return '';
      try {
        const url = new URL(value, window.location.origin);
        const protocol = String(url.protocol || '').toLowerCase();
        if (protocol === 'http:' || protocol === 'https:' || protocol === 'mailto:') return url.href;
      } catch (_) {}
      return '';
    }
    function renderInlineMarkdown(source) {
      const placeholders = [];
      const stash = (html) => {
        const token = `@@MD${placeholders.length}@@`;
        placeholders.push(html);
        return token;
      };
      let text = String(source || '');
      text = text.replace(/`([^`]+)`/g, (_, code) => stash(`<code>${escapeHtml(code)}</code>`));
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => {
        const safeUrl = sanitizeMarkdownUrl(url);
        return safeUrl ? stash(`<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noreferrer">${renderInlineMarkdown(label)}</a>`) : escapeHtml(label);
      });
      text = escapeHtml(text);
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
      text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      text = text.replace(/(^|[\s(>])\*([^*\n]+)\*(?=$|[\s),.!?:;<])/g, '$1<em>$2</em>');
      text = text.replace(/(^|[\s(>])_([^_\n]+)_(?=$|[\s),.!?:;<])/g, '$1<em>$2</em>');
      placeholders.forEach((html, index) => { text = text.replace(`@@MD${index}@@`, html); });
      return text;
    }
    function renderMarkdownToHtml(source) {
      const codeBlocks = [];
      const stashCodeBlock = (html) => {
        const token = `@@CODE${codeBlocks.length}@@`;
        codeBlocks.push(html);
        return token;
      };
      const isSeparatorLine = (value) => /^\s*[-_*]{3,}\s*$/.test(String(value || ''));
      const text = String(source || '').replace(/\r\n?/g, '\n');
      const withCodeBlocks = text.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (_, language, code) => {
        const safeLanguage = String(language || '').trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '');
        const className = safeLanguage ? ` class="language-${safeLanguage}"` : '';
        return stashCodeBlock(`<pre><code${className}>${escapeHtml(String(code || '').replace(/\n$/, ''))}</code></pre>`);
      });
      const blocks = withCodeBlocks.split(/\n{2,}/).filter((item) => item.trim());
      const rendered = blocks.map((block) => {
        const trimmed = block.trim();
        if (!trimmed) return '';
        if (/^@@CODE\d+@@$/.test(trimmed)) return trimmed;
        const headingMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (headingMatch && !trimmed.includes('\n')) {
          const level = headingMatch[1].length;
          return `<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`;
        }
        const lines = trimmed.split('\n');
        if (lines.every((line) => !line.trim() || isSeparatorLine(line))) {
          return `<p><span class="md-separator">···</span></p>`;
        }
        if (lines.every((line) => !line.trim() || /^\s*>\s?/.test(line))) {
          const body = lines.map((line) => line.replace(/^\s*>\s?/, '')).map((line) => renderInlineMarkdown(line)).join('<br>');
          return `<blockquote>${body}</blockquote>`;
        }
        if (lines.every((line) => !line.trim() || /^\s*[-+*]\s+/.test(line))) {
          const items = lines.filter((line) => line.trim()).map((line) => `<li>${renderInlineMarkdown(line.replace(/^\s*[-+*]\s+/, ''))}</li>`).join('');
          return `<ul>${items}</ul>`;
        }
        if (lines.every((line) => !line.trim() || /^\s*\d+\.\s+/.test(line))) {
          const items = lines.filter((line) => line.trim()).map((line) => `<li>${renderInlineMarkdown(line.replace(/^\s*\d+\.\s+/, ''))}</li>`).join('');
          return `<ol>${items}</ol>`;
        }
        const filteredLines = lines.filter((line) => !isSeparatorLine(line));
        if (!filteredLines.length) return '';
        return `<p>${filteredLines.map((line) => renderInlineMarkdown(line)).join('<br>')}</p>`;
      }).join('');
      let html = rendered;
      codeBlocks.forEach((blockHtml, index) => { html = html.replace(`@@CODE${index}@@`, blockHtml); });
      if (html) return html;
      return isSeparatorLine(String(source || '').trim())
        ? `<p><span class="md-separator">···</span></p>`
        : `<p>${renderInlineMarkdown(source || '')}</p>`;
    }
    function buildMessageText(textValue, markdown = false) {
      const node = document.createElement('div');
      node.className = markdown ? 'message-text markdown' : 'message-text';
      if (markdown) node.innerHTML = renderMarkdownToHtml(textValue || '');
      else node.textContent = textValue || '';
      return node;
    }
    function normalizeMessageText(value) {
      const text = String(value || '').replace(/<image\b[^>]*>\s*<\/image>\s*/giu, ' ').split('\n').filter((line) => !/^\s*<\/?image\b/iu.test(line)).join(' ');
      return text.replace(/\s+/g, ' ').trim();
    }
    function normalizeThreadPreviewText(value) {
      const text = normalizeMessageText(value);
      return text.replace(/^命令执行中：/u, '命令：').replace(/^命令已完成：/u, '命令：').trim();
    }
    function messageHasImageMarkup(message) {
      return /<image\b/iu.test(String(message?.text || ''));
    }
    function messageAttachmentCount(message) {
      return Array.isArray(message?.attachments) ? message.attachments.length : 0;
    }
    function messageIdLooksLikeHistory(message) {
      return String(message?.id || '').startsWith('hist_');
    }
    function messagesAreEquivalent(left, right) {
      if (String(left?.role || '') !== String(right?.role || '')) return false;
      if (String(left?.event_type || '') !== String(right?.event_type || '')) return false;
      if (String(left?.role || '') === 'event' && String(left?.event_type || '') === 'command') return false;
      const leftText = normalizeMessageText(left?.text || '');
      const rightText = normalizeMessageText(right?.text || '');
      if (!leftText || leftText !== rightText) return false;
      const looksLikeStoreHistoryMirror = messageIdLooksLikeHistory(left) !== messageIdLooksLikeHistory(right);
      const looksLikeImageMirror =
        messageHasImageMarkup(left)
        || messageHasImageMarkup(right)
        || Boolean(messageAttachmentCount(left)) !== Boolean(messageAttachmentCount(right));
      const leftCreated = Number(left?.created_at || 0);
      const rightCreated = Number(right?.created_at || 0);
      const allowedDelta = looksLikeStoreHistoryMirror || looksLikeImageMirror ? 15 : 3;
      return !(leftCreated && rightCreated && Math.abs(leftCreated - rightCreated) > allowedDelta);
    }
    function messageSignature(message) {
      const role = String(message?.role || '');
      const eventType = String(message?.event_type || '');
      if (role === 'event' && eventType === 'command') return '';
      const text = normalizeMessageText(message?.text || '');
      return text ? `${role}::${eventType}::${text}` : '';
    }
    function mergeEquivalentMessages(baseMessage, overlayMessage) {
      const merged = { ...(baseMessage || {}), ...(overlayMessage || {}) };
      const attachments = [];
      const seen = new Set();
      [...(baseMessage?.attachments || []), ...(overlayMessage?.attachments || [])].forEach((item) => {
        const key = `${item?.kind || ''}::${item?.name || ''}::${item?.path || ''}`;
        if (seen.has(key)) return;
        seen.add(key);
        attachments.push({ ...item });
      });
      if (attachments.length) merged.attachments = attachments;
      const baseText = normalizeMessageText(baseMessage?.text || '');
      const overlayText = normalizeMessageText(overlayMessage?.text || '');
      if (baseText && overlayText === baseText) {
        const baseRawText = String(baseMessage?.text || '');
        const overlayRawText = String(overlayMessage?.text || '');
        const baseHasImageMarkup = messageHasImageMarkup(baseMessage);
        const overlayHasImageMarkup = messageHasImageMarkup(overlayMessage);
        if (baseHasImageMarkup && !overlayHasImageMarkup) {
          merged.text = overlayRawText || baseRawText;
        } else if (!baseHasImageMarkup && overlayHasImageMarkup) {
          merged.text = baseRawText || overlayRawText;
        } else {
          merged.text = overlayRawText || baseRawText;
        }
      }
      const baseCreated = Number(baseMessage?.created_at || 0);
      const overlayCreated = Number(overlayMessage?.created_at || 0);
      merged.created_at = Math.min(baseCreated || overlayCreated || 0, overlayCreated || baseCreated || 0);
      return merged;
    }
    function mergeMessageLists(existing = [], incoming = []) {
      const merged = [];
      const indexById = new Map();
      const signatureIndex = new Map();
      [...existing, ...incoming]
        .filter((message) => message && typeof message === 'object')
        .sort((left, right) => Number(left?.created_at || 0) - Number(right?.created_at || 0))
        .forEach((message) => {
          const messageId = String(message?.id || '').trim();
          if (messageId && indexById.has(messageId)) {
            const index = indexById.get(messageId);
            merged[index] = { ...merged[index], ...message };
            return;
          }
          let duplicateIndex = -1;
          const signature = messageSignature(message);
          if (signature && signatureIndex.has(signature)) {
            const candidates = signatureIndex.get(signature) || [];
            for (let i = candidates.length - 1; i >= 0; i -= 1) {
              const index = candidates[i];
              if (messagesAreEquivalent(merged[index], message)) {
                duplicateIndex = index;
                break;
              }
            }
          }
          if (duplicateIndex >= 0) {
            merged[duplicateIndex] = mergeEquivalentMessages(merged[duplicateIndex], message);
            const mergedId = String(merged[duplicateIndex]?.id || '').trim();
            if (mergedId) indexById.set(mergedId, duplicateIndex);
            if (messageId) indexById.set(messageId, duplicateIndex);
            return;
          }
          merged.push({ ...message });
          const nextIndex = merged.length - 1;
          if (messageId) indexById.set(messageId, nextIndex);
          if (signature) {
            const list = signatureIndex.get(signature) || [];
            list.push(nextIndex);
            signatureIndex.set(signature, list);
          }
        });
      merged.sort((left, right) => Number(left?.created_at || 0) - Number(right?.created_at || 0));
      return merged;
    }
    function normalizeThreadPayload(payload) {
      const thread = payload || {};
      const rawList = Array.isArray(thread.messages) ? thread.messages : [];
      const list = mergeMessageLists([], rawList);
      const total = Number.isFinite(Number(thread.message_total)) ? Number(thread.message_total) : list.length;
      const start = Number.isFinite(Number(thread.message_window_start)) ? Number(thread.message_window_start) : Math.max(0, total - list.length);
      const end = Number.isFinite(Number(thread.message_window_end)) ? Number(thread.message_window_end) : Math.min(total, start + list.length);
      return {
        ...thread,
        messages: list,
        message_total: total,
        message_window_start: Math.max(0, start),
        message_window_end: Math.max(0, end),
        message_loaded_count: Number.isFinite(Number(thread.message_loaded_count)) ? Number(thread.message_loaded_count) : list.length,
        has_older_messages: Boolean(thread.has_older_messages || start > 0),
        has_newer_messages: Boolean(thread.has_newer_messages || end < total),
      };
    }
    function mergeThreadPayload(existing, incoming) {
      const base = normalizeThreadPayload(existing || {});
      const next = normalizeThreadPayload(incoming || {});
      const mergedMessages = mergeMessageLists(base.messages, next.messages);
      const starts = [base.message_window_start, next.message_window_start].filter((value) => Number.isFinite(Number(value)));
      const total = Math.max(base.message_total || 0, next.message_total || 0, mergedMessages.length);
      const start = starts.length ? Math.min(...starts.map((value) => Number(value) || 0)) : Math.max(0, total - mergedMessages.length);
      return normalizeThreadPayload({
        ...base,
        ...next,
        messages: mergedMessages,
        message_total: total,
        message_loaded_count: mergedMessages.length,
        message_window_start: Math.max(0, Math.min(start, total)),
        message_window_end: Math.min(total, Math.max(0, Math.min(start, total)) + mergedMessages.length),
      });
    }
    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error(`读取文件失败：${file.name}`));
        reader.readAsDataURL(file);
      });
    }
    async function loadPendingFiles(files, append = false) {
      const fileList = Array.from(files || []);
      if (!fileList.length) {
        if (!append) clearPendingFiles();
        return;
      }
      const nextItems = append ? [...pendingAttachments] : [];
      if (nextItems.length + fileList.length > MAX_ATTACHMENTS) throw new Error(`单次最多 ${MAX_ATTACHMENTS} 个附件。`);
      for (const file of fileList) {
        if ((file.size || 0) > MAX_ATTACHMENT_BYTES) throw new Error(`附件过大：${file.name}，单个不能超过 25MB。`);
        const dataUrl = await fileToDataUrl(file);
        const isImage = String(file.type || '').startsWith('image/');
        nextItems.push({
          name: file.name,
          type: file.type || 'application/octet-stream',
          kind: isImage ? 'image' : 'file',
          preview: isImage ? dataUrl : '',
          data: dataUrl.split(',')[1] || '',
        });
      }
      pendingAttachments = nextItems;
      renderPendingFiles();
    }
    function clearPendingFiles() {
      pendingAttachments = [];
      fileInput.value = '';
      renderPendingFiles();
    }
    function removePendingFile(index) {
      pendingAttachments = pendingAttachments.filter((_, itemIndex) => itemIndex !== index);
      if (!pendingAttachments.length) fileInput.value = '';
      renderPendingFiles();

        const thread = currentThreadState;
        const threadKey = thread.id || currentThreadId || '';
        const items = (thread.messages || []).map((message, index) => ({
          key: messageRenderKey(message, index),
          fingerprint: messageRenderFingerprint(message),
          message,
        }));
        const nextKeys = items.map((item) => item.key);
        const diff = (!renderedThreadId || renderedThreadId !== threadKey || options.forceFull)
          ? { mode: 'full', delta: nextKeys.length }
          : compareRenderedMessageKeys(renderedMessageKeys, nextKeys);
        syncThreadHeader(thread);
        if (diff.mode === 'full') {
          renderMessagesFull(thread, items);
        } else {
          syncHistoryLoaderNode(thread);
          if (items.length || isActiveJobRunning(thread.active_job)) {
            clearEmptyStateNode();
          }
          if (diff.mode === 'prepend') {
            prependRenderedMessageItems(items.slice(0, diff.delta));
            items.slice(diff.delta).forEach((item) => updateRenderedMessageNode(item));
          } else if (diff.mode === 'append') {
            items.slice(0, renderedMessageKeys.length).forEach((item) => updateRenderedMessageNode(item));
            appendRenderedMessageItems(items.slice(renderedMessageKeys.length));
          } else {
            items.forEach((item) => updateRenderedMessageNode(item));
          }
          renderedThreadId = threadKey;
          renderedMessageKeys = nextKeys;
          syncActiveJobNode(thread.active_job || null);
          if (!items.length && !isActiveJobRunning(thread.active_job)) {
            ensureEmptyStateNode('thread-empty', '当前会话暂无消息。');
          }
        }
        if (stickToBottom) {
          messages.scrollTop = messages.scrollHeight;
        } else if (preserveScroll) {
          const maxScrollTop = Math.max(0, messages.scrollHeight - messages.clientHeight);
          messages.scrollTop = Math.min(previousScrollTop, maxScrollTop);
        }
      } catch (error) {
        console.error(error);
        setStatus(`消息渲染失败：${String(error)}`, 'error');
        syncThreadHeader(currentThreadState || null);
        messages.innerHTML = '<div class="hint">消息渲染失败，请刷新页面重试。</div>';
        resetRenderedMessageState();
      }
    }
    async function loadAuthState() {
      authState = await request('/api/auth/state', {}, false);
      if (!authState.logged_in) {
        window.location.replace(loginUrl());
        throw new Error('未登录');
      }
      sessionBadge.textContent = authState.username ? `已登录 · ${authState.username}` : '已登录';
      sessionBadge.className = 'badge running';
      return authState;
    }
    async function fetchThread(threadId, options = {}) {
      const query = new URLSearchParams({ thread_id: threadId, limit: String(options.limit || THREAD_PAGE_SIZE) });
      if (options.before !== undefined && options.before !== null && options.before !== '') query.set('before', String(options.before));
      const payload = await request(`/api/codex/thread?${query.toString()}`);
      return normalizeThreadPayload(payload);
    }
    async function loadThreads(preferredThreadId = '') {
      const payload = await request('/api/codex/threads');
      threadsState = payload.threads || [];
      if (preferredThreadId) currentThreadId = preferredThreadId;
      else if (currentThreadId && !threadsState.some((item) => item.id === currentThreadId)) currentThreadId = threadsState[0]?.id || '';
      else if (!currentThreadId) currentThreadId = threadsState[0]?.id || '';
      renderThreads();
      if (currentThreadId) await openThread(currentThreadId, false);
      else {
        currentThreadState = null;
        renderMessages();
      }
    }
    async function openThread(threadId, renderList = true) {
      if (!threadId) {
        currentThreadId = '';
        currentThreadState = null;
        activeJobId = '';
        threadLoadingOlder = false;
        currentWorkdir = DEFAULT_WORKDIR;
        renderMessages();
        if (renderList) renderThreads();
        stopJobPolling();
        return;
      }
      currentThreadId = threadId;
      threadLoadingOlder = false;
      const payload = await fetchThread(threadId, { limit: THREAD_PAGE_SIZE });
      currentThreadState = payload;
      currentWorkdir = payload.cwd || currentWorkdir || DEFAULT_WORKDIR;
      activeJobId = payload.active_job?.id || '';
      if (renderList) renderThreads();
      renderMessages();
      if (activeJobId) startJobPolling(activeJobId, threadId);
      else stopJobPolling();
      syncInterruptButton();
    }
    async function loadOlderMessages() {
      if (!currentThreadId || !currentThreadState?.has_older_messages || threadLoadingOlder) return;
      const requestedThreadId = currentThreadId;
      const before = Number(currentThreadState.message_window_start || 0);
      if (before <= 0) return;
      threadLoadingOlder = true;
      const previousScrollHeight = messages.scrollHeight;
      const previousScrollTop = messages.scrollTop;
      try {
        const payload = await fetchThread(requestedThreadId, { limit: THREAD_PAGE_SIZE, before });
        if (currentThreadId !== requestedThreadId || payload.id !== requestedThreadId) {
          threadLoadingOlder = false;
          return;
        }
        currentThreadState = mergeThreadPayload(payload, currentThreadState);
        threadLoadingOlder = false;
        renderMessages({ stickToBottom: false, preserveScroll: false });
        requestAnimationFrame(() => {
          const nextScrollHeight = messages.scrollHeight;
          messages.scrollTop = Math.max(0, nextScrollHeight - previousScrollHeight + previousScrollTop);
        });
      } catch (error) {
        threadLoadingOlder = false;
        renderMessages({ stickToBottom: false });
        setStatus(String(error), 'error');
      }
    }
    function stopJobPolling() {
      if (jobPollTimer) {
        clearTimeout(jobPollTimer);
        jobPollTimer = null;
      }
      activeJobId = '';
      jobPollFailureCount = 0;
      syncInterruptButton();
    }
    async function pollJob(jobId, threadId) {
      try {
        const stickToBottom = isNearBottom();
        const jobPayload = await request(`/api/codex/job?job_id=${encodeURIComponent(jobId)}`);
        if (currentThreadId !== threadId) return;
        if (currentThreadState) {
          currentThreadState = {
            ...currentThreadState,
            updated_at: Math.max(Number(currentThreadState.updated_at || 0), Number(jobPayload.updated_at || 0)),
            active_job: jobPayload,
          };
        }
        activeJobId = String(jobPayload?.id || '');
        jobPollFailureCount = 0;
        renderMessages({ stickToBottom });
        if (jobPayload.status === 'running') {
          jobPollTimer = window.setTimeout(() => pollJob(jobId, threadId), 1000);
          return;
        }
        stopJobPolling();
        await loadThreads(threadId);
      } catch (error) {
        if (currentThreadId !== threadId || activeJobId !== jobId) {
          stopJobPolling();
          return;
        }
        jobPollFailureCount += 1;
        const retryDelay = Math.min(8000, 1200 + jobPollFailureCount * 1000);
        jobPollTimer = window.setTimeout(() => pollJob(jobId, threadId), retryDelay);
        setStatus(`Codex 任务轮询失败，将自动重试：${String(error)}`, 'error');
      }
    }
    function startJobPolling(jobId, threadId) {
      stopJobPolling();
      activeJobId = jobId;
      jobPollFailureCount = 0;
      syncInterruptButton();
      jobPollTimer = window.setTimeout(() => pollJob(jobId, threadId), 700);
    }
    function startNewThreadDraft() {
      currentThreadId = '';
      currentThreadState = null;
      stopJobPolling();
      renderThreads();
      renderMessages();
      closeSidebarDrawer();
      resizePromptInput();
      promptInput.focus();
      setStatus('已切换到新会话草稿。');
    }
    async function sendMessage() {
      const prompt = promptInput.value.trim();
      if (!prompt) throw new Error('请输入要发送给 Codex 的消息。');
      sendBtn.disabled = true;
      try {
        const data = await request('/api/codex/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            thread_id: currentThreadId,
            prompt,
            cwd: String(currentWorkdir || DEFAULT_WORKDIR).trim() || DEFAULT_WORKDIR,
            model: String(currentModel || '').trim(),
            attachments: pendingAttachments.map((item) => ({ name: item.name, type: item.type, data: item.data, kind: item.kind })),
          }),
        });
        promptInput.value = '';
        resizePromptInput();
        clearPendingFiles();
        currentThreadId = data.thread_id;
        await loadThreads(data.thread_id);
        if (data.job?.id) startJobPolling(data.job.id, data.thread_id);
        setStatus('消息已发送。', 'ok');
      } finally {
        sendBtn.disabled = false;
        syncInterruptButton();
      }
    }
    async function interruptCurrentJob() {
      const threadId = String(currentThreadState?.id || currentThreadId || '').trim();
      const jobId = String(currentThreadState?.active_job?.id || activeJobId || '').trim();
      if (!threadId && !jobId) throw new Error('当前没有可中断的任务。');
      interruptInFlight = true;
      syncInterruptButton();
      try {
        const data = await request('/api/codex/job/cancel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread_id: threadId, job_id: jobId }),
        });
        stopJobPolling();
        await loadThreads(String(data?.thread_id || threadId || '').trim());
        setStatus('已中断当前任务。', 'ok');
      } finally {
        interruptInFlight = false;
        syncInterruptButton();
      }
    }
    async function forceStopThread(threadId, jobId = '') {
      const targetThreadId = String(threadId || '').trim();
      const targetJobId = String(jobId || '').trim();
      if (!targetThreadId && !targetJobId) throw new Error('当前没有可强制停止的任务。');
      const targetThread = threadsState.find((item) => String(item?.id || '').trim() === targetThreadId);
      const targetTitle = String(targetThread?.title || targetThreadId || targetJobId).trim() || targetJobId;
      if (!window.confirm(`确认强制停止会话「${targetTitle}」的当前任务？\n这会直接终止后台 Codex 进程。`)) {
        setStatus('已取消强制停止。');
        return;
      }
      stoppingThreadIds.add(targetThreadId);
      renderThreads();
      try {
        const data = await request('/api/codex/job/cancel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread_id: targetThreadId, job_id: targetJobId, force: true }),
        });
        const preferredThreadId = currentThreadId || targetThreadId;
        await loadThreads(preferredThreadId);
        setStatus('已强制停止当前任务。', 'ok');
        return data;
      } finally {
        stoppingThreadIds.delete(targetThreadId);
        renderThreads();
        syncInterruptButton();
      }
    }
    async function deleteThread(threadId = currentThreadId) {
      const targetThreadId = String(threadId || '').trim();
      if (!targetThreadId) throw new Error('当前没有可删除的会话。');
      const targetThread = threadsState.find((item) => String(item?.id || '').trim() === targetThreadId);
      const targetTitle = String(targetThread?.title || currentThreadState?.title || targetThreadId).trim() || targetThreadId;
      if (!window.confirm(`确认删除会话「${targetTitle}」？\n删除后不可恢复。`)) {
        setStatus('已取消删除。');
        return;
      }
      await request('/api/codex/thread/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_id: targetThreadId }),
      });
      if (currentThreadId === targetThreadId) {
        currentThreadId = '';
        currentThreadState = null;
      }
      await loadThreads(currentThreadId);
      setStatus('会话已删除。', 'ok');
    }
    async function logout() {
      await request('/api/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      }, false);
      stopJobPolling();
      window.location.replace(loginUrl());
    }
    function openPreview(items, index = 0) {
      previewItems = Array.isArray(items) ? items : [];
      previewIndex = Math.max(0, Math.min(index, previewItems.length - 1));
      previewScale = 1;
      renderPreview();
      previewBackdrop.classList.remove('hidden');
    }
    function closePreview() { previewBackdrop.classList.add('hidden'); }
    function clampPreviewScale(value) { return Math.max(0.2, Math.min(4, Number(value || 1))); }
    function renderPreview() {
      const item = previewItems[previewIndex] || {};
      previewTitle.textContent = item.name || '图片预览';
      const itemPath = String(item.path || '').trim();
      if (!itemPath) {
        previewImg.src = item.url || '';
      } else {
        previewImg.dataset.previewPath = itemPath;
        const cachedUrl = attachmentObjectUrlCache.get(itemPath);
        if (cachedUrl) {
          previewImg.src = cachedUrl;
        } else {
          previewImg.removeAttribute('src');
          resolveAttachmentObjectUrl(itemPath)
            .then((objectUrl) => {
              if (previewImg.dataset.previewPath !== itemPath) return;
              previewImg.src = objectUrl;
            })
            .catch(() => {
              if (previewImg.dataset.previewPath !== itemPath) return;
              previewImg.removeAttribute('src');
            });
        }
      }
      previewImg.style.transform = `scale(${previewScale})`;
      previewMeta.textContent = `${previewIndex + 1}/${previewItems.length || 0} · ${item.name || '-'}`;
      previewPrevBtn.disabled = previewIndex <= 0;
      previewNextBtn.disabled = previewIndex >= previewItems.length - 1;
    }
    function stepPreview(offset) {
      previewIndex = Math.max(0, Math.min(previewIndex + offset, previewItems.length - 1));
      renderPreview();
    }
    function zoomPreview(nextScale) { previewScale = clampPreviewScale(nextScale); renderPreview(); }

    newThreadBtn.addEventListener('click', startNewThreadDraft);
    mobileNewThreadBtn.addEventListener('click', startNewThreadDraft);
    mobileSidebarBtn.addEventListener('click', openSidebarDrawer);
    mobileCloseSidebarBtn.addEventListener('click', closeSidebarDrawer);
    mobileBackdrop.addEventListener('click', closeSidebarDrawer);
    logoutBtn.addEventListener('click', async () => {
      try { await logout(); } catch (error) { setStatus(String(error), 'error'); }
    });
    sendBtn.addEventListener('click', async () => {
      try { await sendMessage(); } catch (error) { setStatus(String(error), 'error'); }
    });
    interruptBtn.addEventListener('click', async () => {
      try { await interruptCurrentJob(); } catch (error) { setStatus(String(error), 'error'); }
    });
    clearAttachmentsBtn.addEventListener('click', () => clearPendingFiles());
    fileInput.addEventListener('change', async (event) => {
      try { await loadPendingFiles(event.target.files, true); setStatus('附件已加入。'); } catch (error) { setStatus(String(error), 'error'); }
    });
    promptInput.addEventListener('keydown', async (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        try { await sendMessage(); } catch (error) { setStatus(String(error), 'error'); }
      }
    });
    promptInput.addEventListener('input', resizePromptInput);
    promptInput.addEventListener('paste', async (event) => {
      const files = Array.from(event.clipboardData?.files || []);
      if (!files.length) return;
      event.preventDefault();
      try { await loadPendingFiles(files, true); setStatus('已从剪贴板加入附件。'); } catch (error) { setStatus(String(error), 'error'); }
    });
    messages.addEventListener('scroll', () => {
      if (messages.scrollTop <= 48) loadOlderMessages();
    });
    previewCloseBtn.addEventListener('click', closePreview);
    previewBackdrop.addEventListener('click', (event) => { if (event.target === previewBackdrop) closePreview(); });
    previewPrevBtn.addEventListener('click', () => stepPreview(-1));
    previewNextBtn.addEventListener('click', () => stepPreview(1));
    previewZoomOutBtn.addEventListener('click', () => zoomPreview(previewScale - 0.2));
    previewZoomResetBtn.addEventListener('click', () => zoomPreview(1));
    previewZoomInBtn.addEventListener('click', () => zoomPreview(previewScale + 0.2));
    window.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!previewBackdrop.classList.contains('hidden')) closePreview();
      closeSidebarDrawer();
    });
    const handleLayoutChange = () => {
      if (LAYOUT_OVERRIDE === 'mobile' || LAYOUT_OVERRIDE === 'desktop') return;
      applyLayoutMode();
    };
    if (typeof LAYOUT_MEDIA.addEventListener === 'function') {
      LAYOUT_MEDIA.addEventListener('change', handleLayoutChange);
    } else if (typeof LAYOUT_MEDIA.addListener === 'function') {
      LAYOUT_MEDIA.addListener(handleLayoutChange);
    }

    (async () => {
      try {
        applyLayoutMode();
        await loadAuthState();
        await loadThreads();
        renderPendingFiles();
        resizePromptInput();
        syncInterruptButton();
        if (!isMobileLayout()) {
          promptInput.focus();
        }
      } catch (error) {
        if (String(error) !== '未登录') setStatus(String(error), 'error');
      }
    })();
  </script>
</body>
</html>
